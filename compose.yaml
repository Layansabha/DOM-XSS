name: dom-xss-pipeline

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=512m,mode=1777
  depends_on:
    redis:
      condition: service_healthy
    zap:
      condition: service_healthy
  networks:
    - backend

services:
  api:
    <<: *app-common
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true

  worker:
    <<: *app-common
    command:
      - rq
      - worker
      - domxss
      - --url
      - redis://redis:6379/0
      - --logging-level
      - INFO
    shm_size: 1gb
    read_only: true

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - backend

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - rules.domxss.browserid=firefox-headless
    environment:
      ZAP_PORT: "8080"
      ZAP_API_KEY: ${ZAP_API_KEY}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY}" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
    internal: false
