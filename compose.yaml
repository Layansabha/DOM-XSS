name: dom-xss-pipeline

x-app-common: &app-common
  image: ${APP_IMAGE:-dom-xss-pipeline:local}
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=512m,mode=1777
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  api:
    <<: *app-common
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true

  worker:
    <<: *app-common
    environment:
      WORKER_NAME: ${WORKER_NAME:-domxss-worker}
    command:
      - /bin/sh
      - -c
      - exec rq worker "$${QUEUE_NAME}" --url "$${REDIS_URL}" --name "$${WORKER_NAME}" --logging_level INFO
    shm_size: 1gb
    read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping(); command=open('/proc/1/cmdline','rb').read().replace(b'\\0', b' '); assert b'rq worker' in command"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - backend

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
    internal: false
