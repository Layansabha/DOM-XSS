name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: check --output-format=concise .

  typecheck:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade 'pip>=26.1.2'
          .venv/bin/python -m pip install --quiet --disable-pip-version-check -e '.[dev]'

      - name: Mypy
        run: .venv/bin/mypy app

  quality:
    runs-on: ubuntu-24.04
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: pytest

  audit:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade 'pip>=26.1.2'
          .venv/bin/python -m pip install --quiet --disable-pip-version-check -e '.[dev]'

      - name: Pip audit
        run: .venv/bin/pip-audit

  container:
    runs-on: ubuntu-24.04
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build image
        run: docker build --pull -t dom-xss-pipeline:${{ github.sha }} .

      - name: Model artifact smoke test
        run: |
          docker run --rm dom-xss-pipeline:${{ github.sha }} \
            python -c "from app.services.ml import get_model_service; service=get_model_service(); assert len(service.vocabulary) == 500; print(type(service.model).__name__)"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dom-xss-pipeline:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
