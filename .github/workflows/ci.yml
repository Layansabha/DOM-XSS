name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: check --output-format=concise .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade 'pip>=26.1.2'
          .venv/bin/python -m pip install --quiet --disable-pip-version-check -e '.[dev]'

      - name: Mypy
        run: .venv/bin/mypy app

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: pytest

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade 'pip>=26.1.2'
          .venv/bin/python -m pip install --quiet --disable-pip-version-check -e '.[dev]'

      - name: Pip audit
        run: .venv/bin/pip-audit

  container:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, quality, audit]
    steps:
      - name: Checkout PR head
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${REVISION}"
          git checkout --quiet FETCH_HEAD

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Redis Compose smoke test
        run: |
          docker compose up -d --wait redis
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"

      - name: Stop Compose smoke services
        if: always()
        run: docker compose down --volumes

      - name: Build image
        shell: bash
        run: |
          set -o pipefail
          docker build --pull --progress=plain -t dom-xss-pipeline:${{ github.sha }} . 2>&1 | tail -n 45

      - name: Model artifact smoke test
        run: |
          docker run --rm dom-xss-pipeline:${{ github.sha }} \
            python -c "import importlib.util; from app.services.ml import get_model_service; service=get_model_service(); result=service.predict('', 'function sink(){document.write(location.hash)}'); assert len(service.vocabulary)==500; assert type(service.model).__name__=='Booster'; assert result is not None; assert importlib.util.find_spec('sklearn') is None; assert importlib.util.find_spec('joblib') is None; print(type(service.model).__name__, result.probability)"

      - name: Trivy image scan
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dom-xss-pipeline:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy.outcome != 'skipped'
        with:
          sarif_file: trivy-results.sarif

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [container]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/layansabha/dom-xss
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
