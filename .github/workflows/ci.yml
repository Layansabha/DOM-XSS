name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Unit tests
        run: pytest

      - name: Dependency audit
        run: pip-audit

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check

      - name: Terraform initialize
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Terraform tests
        run: terraform -chdir=infra/terraform test

  container:
    runs-on: ubuntu-24.04
    needs: [quality, infrastructure]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose and monitoring configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f deploy/compose.vps.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.observability.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.e2e.yaml config --quiet
          python -m json.tool deploy/monitoring/grafana/dashboards/dom-xss-containers.json >/dev/null
          python -m compileall -q app scripts/e2e_smoke.py

      - name: Build application image
        run: |
          set -o pipefail
          docker build --pull --progress=plain \
            -t dom-xss-pipeline:${{ github.sha }} . 2>&1 | tail -n 60

      - name: Model artifact smoke test
        run: |
          docker run --rm dom-xss-pipeline:${{ github.sha }} \
            python -c "import importlib.util; from app.services.ml import get_model_service; service=get_model_service(); result=service.predict('', 'function sink(){document.write(location.hash)}'); zero=service.predict('', 'quuxxyz;'); assert len(service.vocabulary)==500; assert type(service.model).__name__=='Booster'; assert result is not None and result.status=='scored' and result.probability is not None and result.probability>0.9; assert zero is not None and zero.status=='insufficient_feature_coverage' and zero.probability is None; assert importlib.util.find_spec('sklearn') is None; assert importlib.util.find_spec('joblib') is None; print(type(service.model).__name__, result.probability, zero.status)"

      - name: RQ worker command smoke test
        run: |
          docker run --rm dom-xss-pipeline:${{ github.sha }} \
            rq worker --help | grep --quiet --fixed-strings -- '--logging_level'

      - name: End-to-end Compose scan
        env:
          APP_IMAGE: dom-xss-pipeline:${{ github.sha }}
        run: |
          docker compose \
            -f compose.yaml \
            -f deploy/compose.e2e.yaml \
            up -d --no-build --wait
          python scripts/e2e_smoke.py

      - name: Show end-to-end logs on failure
        if: failure()
        env:
          APP_IMAGE: dom-xss-pipeline:${{ github.sha }}
        run: |
          docker compose \
            -f compose.yaml \
            -f deploy/compose.e2e.yaml \
            ps
          docker compose \
            -f compose.yaml \
            -f deploy/compose.e2e.yaml \
            logs --no-color --tail=250 api worker redis zap test-target

      - name: Stop end-to-end environment
        if: always()
        env:
          APP_IMAGE: dom-xss-pipeline:${{ github.sha }}
        run: |
          docker compose \
            -f compose.yaml \
            -f deploy/compose.e2e.yaml \
            down --volumes --remove-orphans

      - name: Generate Trivy security report
        id: trivy_report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dom-xss-pipeline:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy security report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy_report.outcome != 'skipped'
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce High and Critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dom-xss-pipeline:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    needs: [container]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/layansabha/dom-xss
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
