name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: check --output-format=concise .

  quality:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest

      - name: Dependency audit
        run: pip-audit

  container:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build image
        run: docker build --pull -t dom-xss-pipeline:${{ github.sha }} .

      - name: Model artifact smoke test
        run: |
          docker run --rm dom-xss-pipeline:${{ github.sha }} \
            python -c "from app.services.ml import get_model_service; service=get_model_service(); assert len(service.vocabulary) == 500; print(type(service.model).__name__)"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: dom-xss-pipeline:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
