services:
  api:
    environment:
      ZAP_ENABLED: "true"

  worker:
    environment:
      ZAP_ENABLED: "true"
    depends_on:
      zap:
        condition: service_healthy

  zap:
    image: zaproxy/zap-stable:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - rules.domxss.browserid=firefox-headless
    environment:
      ZAP_PORT: "8080"
      ZAP_API_KEY: ${ZAP_API_KEY}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY}" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend
