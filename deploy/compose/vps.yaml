services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  caddy-data:
  caddy-config:
