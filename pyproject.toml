[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dom-xss-pipeline"
version = "1.0.0"
description = "Deployable DOM XSS LightGBM analysis and OWASP ZAP verification pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Layan Sabha" }]
dependencies = [
  "fastapi==0.140.13",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings==2.14.2",
  "redis>=7.2,<9",
  "rq==2.10.0",
  "playwright==1.61.0",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "numpy==2.5.1",
  "lightgbm==4.7.0",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "tree-sitter==0.26.0",
  "tree-sitter-javascript==0.25.0",
  "prometheus-client==0.26.0",
]

[project.scripts]
domxss = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
  "mypy>=1.16,<3",
  "types-beautifulsoup4>=4.12,<5",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = [
  "S104",
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S310"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests"]
